name: Admin Add Cloud Mail User

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email address to create'
        required: true
      salt:
        description: 'Password salt'
        required: true
      hash:
        description: 'Password hash'
        required: true
      type:
        description: 'Role type id'
        required: false
        default: '1'

jobs:
  add-user:
    runs-on: ubuntu-latest
    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      EMAIL: ${{ inputs.email }}
      SALT: ${{ inputs.salt }}
      HASH: ${{ inputs.hash }}
      TYPE_ID: ${{ inputs.type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add user to Cloud Mail D1
        working-directory: ./mail-worker
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/add-user.sql
          function esc(s){ return String(s).replaceAll("'", "''"); }
          const email = process.env.EMAIL;
          const prefix = email.split('@')[0];
          const type = Number(process.env.TYPE_ID || 1);
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('bad email');
          if (!Number.isInteger(type) || type < 0) throw new Error('bad type');
          const e = esc(email), name = esc(prefix), salt = esc(process.env.SALT), hash = esc(process.env.HASH);
          console.log(`INSERT INTO user (email, type, password, salt, status, reg_key_id, is_del) SELECT '${e}', ${type}, '${hash}', '${salt}', 0, 0, 0 WHERE NOT EXISTS (SELECT 1 FROM user WHERE email COLLATE NOCASE = '${e}');`);
          console.log(`INSERT INTO account (email, name, user_id, status, all_receive, sort, is_del) SELECT '${e}', '${name}', user_id, 0, 0, 0, 0 FROM user WHERE email COLLATE NOCASE = '${e}' AND NOT EXISTS (SELECT 1 FROM account WHERE email COLLATE NOCASE = '${e}');`);
          console.log(`SELECT u.user_id, u.email, u.type, a.account_id, a.name FROM user u LEFT JOIN account a ON a.email = u.email WHERE u.email COLLATE NOCASE = '${e}';`);
          NODE
          npx wrangler@4 d1 execute "$NAME" --remote --file /tmp/add-user.sql
