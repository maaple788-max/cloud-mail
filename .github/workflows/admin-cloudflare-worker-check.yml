name: Admin Cloudflare Worker Check

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check only'
        required: true
        default: 'check'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN || 'mail.maaple.xyz' }}
    steps:
      - name: Check Cloudflare worker/domain binding
        shell: bash
        run: |
          set -euo pipefail
          api(){ curl -fsS -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "$@"; }
          api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/domains" > /tmp/domains.json
          api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$NAME/settings" > /tmp/name-settings.json
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          token=os.environ['CF_TOKEN']; acct=os.environ['CF_ACCOUNT_ID']; name=os.environ['NAME']; host=os.environ['CUSTOM_DOMAIN']
          domains=json.load(open('/tmp/domains.json'))
          ns=json.load(open('/tmp/name-settings.json'))
          matches=[x for x in (domains.get('result') or []) if x.get('hostname')==host]
          svc=matches[0].get('service') if matches else None
          def summarize_settings(d):
              binds=d.get('result',{}).get('bindings') or []
              return [{'name':b.get('name'), 'type':b.get('type'), 'has_id':bool(b.get('id') or b.get('database_id'))} for b in binds]
          out={'domain_found':bool(matches),'domain_service_equals_name':svc==name,'name_bindings':summarize_settings(ns)}
          if svc:
              req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{acct}/workers/scripts/{svc}/settings', headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r:
                  ss=json.load(r)
              out['domain_service_bindings']=summarize_settings(ss)
              out['domain_service_has_db']=any(b.get('name')=='db' for b in out['domain_service_bindings'])
              out['domain_service_has_kv']=any(b.get('name')=='kv' for b in out['domain_service_bindings'])
          out['name_has_db']=any(b.get('name')=='db' for b in out['name_bindings'])
          out['name_has_kv']=any(b.get('name')=='kv' for b in out['name_bindings'])
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
