name: Admin Cloudflare Worker Check

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check or route'
        required: true
        default: 'check'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN || 'mail.maaple.xyz' }}
    steps:
      - name: Check Cloudflare worker/domain binding
        shell: bash
        run: |
          set -euo pipefail
          api(){ curl -fsS -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "$@"; }
          echo "account=$CF_ACCOUNT_ID worker=$NAME host=$CUSTOM_DOMAIN"
          echo '== worker settings/bindings =='
          api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$NAME/settings" | python3 - <<'PY'
          import sys,json
          d=json.load(sys.stdin)
          print(json.dumps({'success':d.get('success'),'errors':d.get('errors'),'bindings':d.get('result',{}).get('bindings')},ensure_ascii=False,indent=2))
          PY
          echo '== custom domains =='
          api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/domains" | python3 - <<'PY'
          import sys,json,os
          d=json.load(sys.stdin); host=os.environ.get('CUSTOM_DOMAIN')
          res=d.get('result') or []
          keep=[x for x in res if host in json.dumps(x)]
          print(json.dumps({'success':d.get('success'),'errors':d.get('errors'),'matched':keep[:20]},ensure_ascii=False,indent=2))
          PY
