name: 🔎 Find Deleted Cloud Mail

on:
  workflow_dispatch:

jobs:
  find-deleted-mail:
    name: Query deleted mail by subject
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mail-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: latest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ./mail-worker/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Query deleted mail
        run: |
          set -euo pipefail
          DB_NAME="cloud-mail"
          SQL="SELECT e.email_id, e.user_id, e.account_id, u.email AS user_email, a.email AS account_email, e.send_email, e.to_email, e.subject, e.create_time, e.is_del, e.unread, substr(COALESCE(e.text, ''), 1, 180) AS text_preview FROM email e LEFT JOIN user u ON e.user_id = u.user_id LEFT JOIN account a ON e.account_id = a.account_id WHERE COALESCE(e.is_del, 0) <> 0 AND lower(COALESCE(e.subject, '')) LIKE '%your new plan%' ORDER BY e.create_time DESC LIMIT 50;"
          echo "Deleted Cloud Mail subject search: your new plan"
          pnpm wrangler d1 execute "$DB_NAME" --remote --command "$SQL"
