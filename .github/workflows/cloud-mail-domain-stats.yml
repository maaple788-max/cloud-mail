name: 📊 Cloud Mail Domain User Stats

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/cloud-mail-domain-stats.yml"

jobs:
  domain-stats:
    name: Query user counts by email domain
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: latest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install wrangler
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile
      - name: Query D1 user counts by domain
        working-directory: ./mail-worker
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi
          DB_NAME="cloud-mail"
          SQL="SELECT LOWER(SUBSTR(email, INSTR(email, '@') + 1)) AS domain, COUNT(*) AS total_count, SUM(CASE WHEN COALESCE(is_del, 0) = 0 THEN 1 ELSE 0 END) AS active_count, SUM(CASE WHEN COALESCE(is_del, 0) != 0 THEN 1 ELSE 0 END) AS deleted_count FROM user GROUP BY domain ORDER BY total_count DESC, domain ASC;"
          echo "Cloud Mail user/mailbox counts by domain"
          echo "Using D1 database name: ${DB_NAME}"
          pnpm wrangler d1 execute "$DB_NAME" --remote --command "$SQL"
