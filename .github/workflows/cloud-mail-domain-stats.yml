name: 📊 Cloud Mail Domain User Stats

on:
  workflow_dispatch:

jobs:
  domain-user-stats:
    name: Query user counts by email domain
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile

      - name: Query D1 user counts by domain
        working-directory: ./mail-worker
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi
          if [ -z "${D1_DATABASE_ID:-}" ]; then
            echo "❌ D1_DATABASE_ID is missing"
            exit 1
          fi

          SQL="SELECT LOWER(SUBSTR(email, INSTR(email, '@') + 1)) AS domain, COUNT(*) AS user_count FROM user WHERE is_del = 0 GROUP BY domain ORDER BY user_count DESC;"
          echo "📊 Cloud Mail active users by domain"
          pnpm wrangler d1 execute "$D1_DATABASE_ID" --remote --command "$SQL"
